<article class="px-row" tabindex="0">
  <label class="px-sel" anvil:name="sel_box" title="Select"><input type="checkbox" anvil:dom-node="pick" aria-label="Select this feedback"></label>
  <div class="px-row-main">
    <div class="px-row-top">
      <anvil-component type="Label" name="kind_badge"></anvil-component>
      <anvil-component type="Label" name="prio_badge"></anvil-component>
      <span class="px-starred" anvil:name="star_mark" title="Starred"><i class="ic ic-star"></i></span>
      <anvil-component type="Label" name="who" prop:role='["px-row-who"]'></anvil-component>
      <span class="ui-spacer"></span>
      <anvil-component type="Label" name="assignee" prop:role='["px-who"]'></anvil-component>
      <anvil-component type="Label" name="when" prop:role='["mono-faint"]'></anvil-component>
    </div>
    <anvil-component type="Label" name="message" prop:role='["px-row-msg"]' bind:text="self.item['message']"></anvil-component>
    <div class="px-row-bot">
      <anvil-component type="Label" name="status_badge"></anvil-component>
      <anvil-component type="Label" name="replied" prop:text="Sender replied" prop:role='["px-replied"]' prop:tooltip="The sender replied on their tracking page"></anvil-component>
      <anvil-component type="Label" name="senti_badge"></anvil-component>
      <anvil-component type="Label" name="stars_badge"></anvil-component>
      <anvil-component type="RepeatingPanel" name="tags_panel" prop:item_template="Prepsto.Items.TagChip" prop:role='["contents"]'></anvil-component>
      <anvil-component type="Label" name="story_tag" prop:role='["px-tag", "ic-story"]'></anvil-component>
      <anvil-component type="Label" name="board" prop:role='["mono-faint"]'></anvil-component>
    </div>
  </div>
</article>
