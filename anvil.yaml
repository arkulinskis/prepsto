    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="keywords" content="customer feedback widget, feedback button for website, user feedback tool, feature request tracking, user stories from feedback, feedback triage, closed-loop feedback, product feedback board, embed feedback form">
