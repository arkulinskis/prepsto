    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Service", "@id": "https://prepsto.com/#app", "name": "Prepsto", "url": "https://prepsto.com/", "description": "A feedback panel you drop on any site with one link. Collect, triage and turn customer feedback into user stories, and let people track what happens to their idea.", "image": "https://prepsto.com/_/theme/og-image.png", "serviceType": "Collect customer feedback and turn it into user stories", "provider": {"@id": "https://arkvital.com/#org"}, "areaServed": "Worldwide", "availableChannel": {"@type": "ServiceChannel", "serviceUrl": "https://prepsto.com/", "name": "Web browser", "availableLanguage": "en"}, "audience": {"@type": "Audience", "audienceType": "Makers of websites and apps who want to hear from their users"}}, {"@type": "WebSite", "@id": "https://prepsto.com/#site", "url": "https://prepsto.com/", "name": "Prepsto", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
