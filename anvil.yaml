metadata:
  description: "A feedback panel you drop on any site with one link. Collect, triage and turn customer feedback into user stories, and let people track what happens to their idea."
  logo_img: "asset:icon-512.png"
  title: "Prepsto: customer feedback panel to user stories"
name: Prepsto
